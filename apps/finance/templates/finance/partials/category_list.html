{% load i18n ui %}{# Lista de categorías con borrado. Parámetro: items #}
<ul class="mt-3 divide-y divide-border">
  {% for c in items %}
  <li x-data="deletable" x-show="!gone" class="flex items-center gap-2 py-2"
      data-delete-url="{% url 'finance:category_delete' c.pk %}"
      data-undo-message="{% blocktranslate trimmed with name=c.name %}Categoría «{{ name }}» borrada{% endblocktranslate %}">
    <span class="size-3 rounded-full {% member_dot c.color %}"></span>
    <span class="flex-1 text-sm">{{ c.name }}</span>
    <button type="button" @click="remove()" class="grid size-8 place-items-center rounded-lg text-muted hover:bg-red-50 hover:text-red-700 dark:hover:bg-red-950 dark:hover:text-red-300"
            aria-label="{% blocktranslate trimmed with name=c.name %}Borrar categoría {{ name }}{% endblocktranslate %}">{% icon "trash-2" "size-4" %}</button>
  </li>
  {% empty %}
  <li class="py-2 text-sm text-muted">—</li>
  {% endfor %}
</ul>
