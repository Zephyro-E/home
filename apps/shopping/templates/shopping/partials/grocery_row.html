{% load i18n ui %}
<li x-data="deletable" x-show="!gone" class="flex items-center gap-1 pr-2"
    data-delete-url="{% url 'shopping:grocery_delete' %}" data-ids="{{ item.pk }}"
    data-undo-message="{% blocktranslate trimmed with name=item.name %}«{{ name }}» quitado de la lista{% endblocktranslate %}">
  <form method="post" action="{% url 'shopping:grocery_toggle' item.pk %}" class="min-w-0 flex-1"
        hx-post="{% url 'shopping:grocery_toggle' item.pk %}" hx-target="#grocery-list" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="checked" value="{% if item.is_checked %}0{% else %}1{% endif %}">
    <button type="submit" class="flex w-full items-center gap-3 px-4 py-3 text-left"
            aria-pressed="{% if item.is_checked %}true{% else %}false{% endif %}"
            aria-label="{% if item.is_checked %}{% blocktranslate trimmed with name=item.name %}Desmarcar {{ name }}{% endblocktranslate %}{% else %}{% blocktranslate trimmed with name=item.name %}Marcar {{ name }} como comprado{% endblocktranslate %}{% endif %}">
      <span class="grid size-6 shrink-0 place-items-center rounded-full border-2 {% if item.is_checked %}border-accent bg-accent text-accent-fg{% else %}border-border{% endif %}">
        {% if item.is_checked %}{% icon "check" "size-4" %}{% endif %}
      </span>
      <span class="min-w-0 flex-1">
        <span class="block truncate {% if item.is_checked %}text-muted line-through{% else %}font-medium{% endif %}">{{ item.name }}</span>
      </span>
      {% if item.quantity %}<span class="shrink-0 rounded-full bg-surface-2 px-2.5 py-0.5 text-xs font-medium text-muted">{{ item.quantity }}</span>{% endif %}
    </button>
  </form>
  <button type="button" @click="remove()" class="grid size-9 shrink-0 place-items-center rounded-lg text-muted hover:bg-red-50 hover:text-red-700 dark:hover:bg-red-950 dark:hover:text-red-300"
          aria-label="{% blocktranslate trimmed with name=item.name %}Quitar {{ name }}{% endblocktranslate %}">
    {% icon "x" "size-4" %}
  </button>
</li>
