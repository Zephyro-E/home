{# Etiqueta de estado de un deseo. Parámetro: item #}
<span class="inline-flex shrink-0 items-center rounded-full px-2 py-0.5 text-xs font-medium
  {% if item.status == 'approved' %}bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200
  {% elif item.status == 'bought' %}bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200
  {% elif item.status == 'discarded' %}bg-surface-2 text-muted
  {% else %}bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200{% endif %}">{{ item.get_status_display }}</span>
