{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Cambiar contraseña" %} · Hogar{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="mb-6 text-2xl font-semibold tracking-tight">{% translate "Cambiar contraseña" %}</h1>
  <section class="rounded-2xl border border-border bg-surface p-5 shadow-sm">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="mt-6 flex items-center gap-3">
        <button type="submit" class="rounded-xl bg-accent px-5 py-2.5 font-semibold text-accent-fg hover:opacity-90">{% translate "Cambiar contraseña" %}</button>
        <a href="{% url 'core:profile' %}" class="text-sm font-medium text-muted hover:text-fg">{% translate "Cancelar" %}</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
