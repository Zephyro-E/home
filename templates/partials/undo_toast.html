{% load i18n ui %}{# Aviso de "Deshacer" tras borrar (ver static/js/app.js, store "undo"). #}
<div x-data x-cloak x-show="$store.undo.visible" x-transition.opacity
     class="fixed inset-x-4 bottom-20 z-40 mx-auto flex max-w-md items-center gap-3 rounded-xl bg-fg px-4 py-3 text-sm text-bg shadow-lg md:bottom-6"
     role="status" aria-live="polite">
  <span class="flex-1" x-text="$store.undo.message"></span>
  <button type="button" @click="$store.undo.undo()"
          class="flex items-center gap-1.5 rounded-lg px-2 py-1 font-semibold text-accent-soft hover:bg-bg/10 dark:text-teal-800">
    {% icon "undo-2" "size-4" %}{% translate "Deshacer" %}
  </button>
</div>
