{% load i18n %}{# Cambio de idioma sin sesión (en el perfil se guarda en la cuenta). #}
{% get_current_language as LANGUAGE_CODE %}{% get_available_languages as LANGUAGES %}{% get_language_info_list for LANGUAGES as languages %}
<form action="{% url 'set_language' %}" method="post" class="flex items-center">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="sr-only" for="lang-select">{% translate "Idioma" %}</label>
  <select id="lang-select" name="language" onchange="this.form.submit()"
          class="min-h-11 rounded-lg border border-transparent bg-transparent px-2 text-sm text-muted hover:bg-surface-2 hover:text-fg focus:outline-none focus:ring-2 focus:ring-accent/30">
    {% for lang in languages %}
      <option value="{{ lang.code }}" {% if lang.code == LANGUAGE_CODE %}selected{% endif %}>{{ lang.name_local|capfirst }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="text-sm">OK</button></noscript>
</form>
