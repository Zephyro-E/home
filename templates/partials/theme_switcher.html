{% load i18n ui %}{# Botón de tema: Sistema → Claro → Oscuro. Parámetro: show_label #}
<button type="button"
        x-data="themeSwitcher"
        @click="cycle()"
        data-label-system="{% translate 'Tema: sistema' %}"
        data-label-light="{% translate 'Tema: claro' %}"
        data-label-dark="{% translate 'Tema: oscuro' %}"
        :aria-label="label"
        :title="label"
        aria-label="{% translate 'Cambiar tema' %}"
        class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-muted transition-colors hover:bg-surface-2 hover:text-fg {% if show_label %}w-full{% endif %}">
  <span x-show="pref === 'system'">{% icon "monitor" "size-5" %}</span>
  <span x-show="pref === 'light'" x-cloak>{% icon "sun" "size-5" %}</span>
  <span x-show="pref === 'dark'" x-cloak>{% icon "moon" "size-5" %}</span>
  {% if show_label %}<span x-text="label">{% translate 'Cambiar tema' %}</span>{% endif %}
</button>
